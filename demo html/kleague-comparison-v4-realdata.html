<!-- v4.0 | 2026-04-19 | 레퍼런스: Squawka Comparison Matrix | 변경: 실DB데이터 반영, 3-카드 비교, 슈팅 지표 5종 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K리그 선수 비교 매트릭스 v4</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ── 기본 리셋 ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0b0e14;
    --surface:   #141921;
    --card:      #1a2030;
    --border:    rgba(255,255,255,0.07);
    --text:      #e8edf5;
    --muted:     #6b7a99;
    --label:     #3d4f6e;

    --p1: #00d4ff;   /* 조르지 — 시안 */
    --p2: #ff6b35;   /* 허율   — 오렌지 */
    --p3: #a8ff3e;   /* 콤파뇨 — 라임 */

    --gold:  #ffd700;
    --best-bg: rgba(255,215,0,0.08);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
  }

  /* ── 헤더 ── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(11,14,20,0.9);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 0 40px;
    height: 56px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    letter-spacing: 2px;
    color: var(--text);
  }
  .logo span { color: var(--p1); }
  .season-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 2px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 4px;
  }

  /* ── 레이아웃 ── */
  .container {
    max-width: 1320px;
    margin: 0 auto;
    padding: 36px 40px;
  }

  .page-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    letter-spacing: 3px;
    color: var(--text);
    margin-bottom: 4px;
  }
  .page-sub {
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 32px;
  }

  /* ── 카드 그리드 ── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 40px;
  }

  /* ── 선수 카드 ── */
  .player-card {
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .player-card:hover { border-color: rgba(255,255,255,0.15); }

  .card-header {
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .card-accent-bar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 12px 12px 0 0;
  }
  .player-color-p1 .card-accent-bar { background: var(--p1); }
  .player-color-p2 .card-accent-bar { background: var(--p2); }
  .player-color-p3 .card-accent-bar { background: var(--p3); }

  .filter-row {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .filter-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-chip.active-p1 { border-color: var(--p1); color: var(--p1); background: rgba(0,212,255,0.08); }
  .filter-chip.active-p2 { border-color: var(--p2); color: var(--p2); background: rgba(255,107,53,0.08); }
  .filter-chip.active-p3 { border-color: var(--p3); color: var(--p3); background: rgba(168,255,62,0.08); }

  .player-name {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text);
  }
  .player-meta {
    display: flex; gap: 12px; align-items: center;
    margin-top: 6px;
  }
  .player-team {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 1px;
  }
  .player-birth {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--label);
  }
  .player-matches {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    margin-left: auto;
  }

  /* 카드 내 스탯 */
  .card-stats {
    padding: 16px 20px 20px;
  }
  .stat-row {
    display: flex;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    gap: 10px;
  }
  .stat-row:last-child { border-bottom: none; }

  .stat-label {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.8px;
    width: 72px;
    flex-shrink: 0;
  }
  .stat-bar-wrap {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.05);
    border-radius: 100px;
    overflow: hidden;
  }
  .stat-bar {
    height: 100%;
    border-radius: 100px;
    transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
  }
  .bar-p1 { background: linear-gradient(90deg, rgba(0,212,255,0.6), var(--p1)); }
  .bar-p2 { background: linear-gradient(90deg, rgba(255,107,53,0.6), var(--p2)); }
  .bar-p3 { background: linear-gradient(90deg, rgba(168,255,62,0.6), var(--p3)); }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    font-weight: 700;
    width: 30px;
    text-align: right;
    flex-shrink: 0;
  }
  .stat-best {
    font-size: 0.65rem;
    width: 16px;
    text-align: center;
    flex-shrink: 0;
    color: var(--gold);
  }

  /* ── 비교 바차트 영역 ── */
  .comparison-section {
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    padding: 28px 32px;
  }
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .compare-metric {
    margin-bottom: 22px;
  }
  .compare-metric:last-child { margin-bottom: 0; }

  .compare-label {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .compare-bars {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .compare-bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .compare-player-tag {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    width: 46px;
    flex-shrink: 0;
    text-align: right;
  }
  .compare-bar-outer {
    flex: 1;
    height: 8px;
    background: rgba(255,255,255,0.05);
    border-radius: 100px;
    overflow: hidden;
  }
  .compare-bar-inner {
    height: 100%;
    border-radius: 100px;
    transition: width 0.9s cubic-bezier(0.4,0,0.2,1);
  }
  .compare-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    font-weight: 700;
    width: 28px;
    flex-shrink: 0;
  }
  .compare-best-badge {
    font-size: 0.6rem;
    background: var(--best-bg);
    color: var(--gold);
    border: 1px solid rgba(255,215,0,0.25);
    border-radius: 4px;
    padding: 1px 5px;
    width: 28px;
    text-align: center;
    flex-shrink: 0;
  }
  .compare-best-badge.empty { visibility: hidden; }

  /* 범례 */
  .legend {
    display: flex; gap: 20px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex; align-items: center; gap: 7px;
    font-size: 0.74rem;
    color: var(--text);
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
  }

  /* ── 반응형 ── */
  @media (max-width: 900px) {
    .cards-grid { grid-template-columns: 1fr; }
    .container { padding: 20px 16px; }
    header { padding: 0 20px; }
  }
</style>
</head>
<body>

<!-- COMPONENT: Header -->
<header>
  <div class="logo"><span>K</span>LEAGUE STATS</div>
  <div class="season-badge">2025 SEASON</div>
</header>
<!-- /COMPONENT: Header -->

<div class="container">

  <div class="page-title">COMPARISON MATRIX</div>
  <div class="page-sub">2025 K LEAGUE 1 · 슈팅 지표 비교 · 시즌 누계</div>

  <!-- COMPONENT: PlayerCards -->
  <div class="cards-grid" id="cardsGrid">

    <!-- 카드 1 — 조르지 (포항) -->
    <div class="player-card player-color-p1">
      <div class="card-header">
        <div class="card-accent-bar"></div>
        <div class="filter-row">
          <span class="filter-chip active-p1">2025</span>
          <span class="filter-chip active-p1">포항</span>
          <span class="filter-chip active-p1">조르지</span>
        </div>
        <div class="player-name">조르지</div>
        <div class="player-meta">
          <span class="player-team">POHANG STEELERS</span>
          <span class="player-birth">1999.06.21</span>
          <span class="player-matches">36경기</span>
        </div>
      </div>
      <div class="card-stats" id="stats-p1"></div>
    </div>

    <!-- 카드 2 — 허율 (울산) -->
    <div class="player-card player-color-p2">
      <div class="card-header">
        <div class="card-accent-bar"></div>
        <div class="filter-row">
          <span class="filter-chip active-p2">2025</span>
          <span class="filter-chip active-p2">울산</span>
          <span class="filter-chip active-p2">허율</span>
        </div>
        <div class="player-name">허율</div>
        <div class="player-meta">
          <span class="player-team">ULSAN HD FC</span>
          <span class="player-birth">2001.04.12</span>
          <span class="player-matches">33경기</span>
        </div>
      </div>
      <div class="card-stats" id="stats-p2"></div>
    </div>

    <!-- 카드 3 — 콤파뇨 (전북) -->
    <div class="player-card player-color-p3">
      <div class="card-header">
        <div class="card-accent-bar"></div>
        <div class="filter-row">
          <span class="filter-chip active-p3">2025</span>
          <span class="filter-chip active-p3">전북</span>
          <span class="filter-chip active-p3">콤파뇨</span>
        </div>
        <div class="player-name">콤파뇨</div>
        <div class="player-meta">
          <span class="player-team">JEONBUK HYUNDAI</span>
          <span class="player-birth">1996.04.22</span>
          <span class="player-matches">27경기</span>
        </div>
      </div>
      <div class="card-stats" id="stats-p3"></div>
    </div>

  </div>
  <!-- /COMPONENT: PlayerCards -->

  <!-- COMPONENT: ComparisonBarChart -->
  <div class="comparison-section">
    <div class="section-title">STAT COMPARISON</div>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--p1)"></div>조르지 · 포항</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--p2)"></div>허율 · 울산</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--p3)"></div>콤파뇨 · 전북</div>
    </div>

    <div id="comparisonBars"></div>
  </div>
  <!-- /COMPONENT: ComparisonBarChart -->

</div>

<script>
// ── 실DB 데이터 (2025 시즌 SUM) ──────────────────────────────
const DATA = {
  p1: { name: '조르지',  color: 'var(--p1)', barClass: 'bar-p1',
        goals: 5, shots: 83, shots_on_target: 30, shots_in_pa: 49, shots_out_pa: 34 },
  p2: { name: '허율',   color: 'var(--p2)', barClass: 'bar-p2',
        goals: 4, shots: 35, shots_on_target: 11, shots_in_pa: 31, shots_out_pa: 4  },
  p3: { name: '콤파뇨', color: 'var(--p3)', barClass: 'bar-p3',
        goals:13, shots: 47, shots_on_target: 25, shots_in_pa: 47, shots_out_pa: 0  },
};

const METRICS = [
  { key: 'goals',          label: '득점'     },
  { key: 'shots',          label: '슈팅'     },
  { key: 'shots_on_target',label: '유효슈팅'  },
  { key: 'shots_in_pa',    label: 'PA내슈팅'  },
  { key: 'shots_out_pa',   label: 'PA외슈팅'  },
];

// 지표별 최대값 계산
function getMax(key) {
  return Math.max(...Object.values(DATA).map(p => p[key]));
}

// ── 선수 카드 내 스탯 렌더 ──────────────────────────────────
function renderCardStats(pid) {
  const p   = DATA[pid];
  const el  = document.getElementById('stats-' + pid);
  const cls = p.barClass;

  el.innerHTML = METRICS.map(m => {
    const val = p[m.key];
    const max = getMax(m.key);
    const pct = max > 0 ? Math.round((val / max) * 100) : 0;
    const isBest = val === max;
    return `
      <div class="stat-row">
        <span class="stat-label">${m.label}</span>
        <div class="stat-bar-wrap">
          <div class="stat-bar ${cls}" style="width:${pct}%"></div>
        </div>
        <span class="stat-value" style="color:${p.color}">${val}</span>
        <span class="stat-best">${isBest ? '★' : ''}</span>
      </div>`;
  }).join('');
}

// ── 비교 바차트 렌더 ──────────────────────────────────────────
function renderComparison() {
  const el = document.getElementById('comparisonBars');
  const players = [DATA.p1, DATA.p2, DATA.p3];

  el.innerHTML = METRICS.map(m => {
    const max     = getMax(m.key);
    const bestVal = max;

    const rows = players.map(p => {
      const val = p[m.key];
      const pct = max > 0 ? Math.round((val / max) * 100) : 0;
      const isBest = val === bestVal;
      return `
        <div class="compare-bar-row">
          <span class="compare-player-tag" style="color:${p.color}">${p.name}</span>
          <div class="compare-bar-outer">
            <div class="compare-bar-inner ${p.barClass}" style="width:${pct}%"></div>
          </div>
          <span class="compare-val" style="color:${p.color}">${val}</span>
          <span class="compare-best-badge ${isBest ? '' : 'empty'}">${isBest ? '★ 최고' : ''}</span>
        </div>`;
    }).join('');

    return `
      <div class="compare-metric">
        <div class="compare-label">${m.label}</div>
        <div class="compare-bars">${rows}</div>
      </div>`;
  }).join('');
}

// ── 초기화 ────────────────────────────────────────────────────
['p1','p2','p3'].forEach(renderCardStats);
renderComparison();
</script>

</body>
</html>
