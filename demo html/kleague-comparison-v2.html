<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K리그 선수 비교</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0d12;
  --surface: #111519;
  --surface2: #181d24;
  --border: #1e2530;
  --accent: #e8ff3c;
  --text: #f0f4ff;
  --muted: #5a6578;
  --muted2: #8a97a8;
  --p1: #e8ff3c;
  --p2: #3caaff;
  --p3: #ff8f3c;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Noto Sans KR',sans-serif; min-height:100vh; }

/* HEADER */
header {
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 40px; border-bottom:1px solid var(--border);
  position:sticky; top:0; background:rgba(10,13,18,0.94);
  backdrop-filter:blur(14px); z-index:200;
}
.logo { display:flex; align-items:baseline; gap:8px; }
.logo-k { font-family:'Bebas Neue',sans-serif; font-size:2.1rem; color:var(--accent); letter-spacing:2px; }
.logo-rest { font-family:'Bebas Neue',sans-serif; font-size:1.5rem; color:var(--text); letter-spacing:4px; opacity:.82; }
.season-badge { font-family:'JetBrains Mono',monospace; font-size:.72rem; color:var(--muted2); border:1px solid var(--border); padding:4px 12px; letter-spacing:1px; }

/* MAIN */
.main { max-width:1320px; margin:0 auto; padding:36px 40px 80px; }
.page-title { margin-bottom:36px; }
.page-title h1 { font-family:'Bebas Neue',sans-serif; font-size:3rem; letter-spacing:3px; }
.page-title h1 span { color:var(--accent); }
.page-title p { margin-top:8px; font-size:.82rem; color:var(--muted2); font-weight:300; }

/* FILTER BAR */
.filter-bar { display:flex; align-items:center; gap:12px; margin-bottom:26px; flex-wrap:wrap; }
.filter-label { font-family:'JetBrains Mono',monospace; font-size:.65rem; letter-spacing:2px; color:var(--muted); text-transform:uppercase; }
.filter-select { background:var(--surface); border:1px solid var(--border); color:var(--text); font-family:'Noto Sans KR',sans-serif; font-size:.78rem; padding:6px 12px; outline:none; cursor:pointer; }
.toggle-wrap { display:flex; align-items:center; gap:8px; margin-left:auto; }
.toggle-label { font-family:'JetBrains Mono',monospace; font-size:.65rem; letter-spacing:1px; color:var(--muted); }
.toggle { width:36px; height:20px; background:var(--border); border-radius:10px; position:relative; cursor:pointer; transition:background .2s; }
.toggle.on { background:#3caaff; }
.toggle::after { content:''; width:14px; height:14px; background:#fff; border-radius:50%; position:absolute; top:3px; left:3px; transition:left .2s; }
.toggle.on::after { left:19px; }

/* PLAYER SELECTOR */
.player-selector { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:28px; }
.player-card { background:var(--surface); border:1px solid var(--border); padding:18px; cursor:pointer; transition:border-color .2s; }
.player-card.active-1 { border-color:var(--p1); }
.player-card.active-2 { border-color:var(--p2); }
.player-card.active-3 { border-color:var(--p3); }
.player-slot-label { font-family:'JetBrains Mono',monospace; font-size:.62rem; color:var(--muted); letter-spacing:2px; margin-bottom:10px; }
.player-card.active-1 .player-slot-label { color:var(--p1); }
.player-card.active-2 .player-slot-label { color:var(--p2); }
.player-card.active-3 .player-slot-label { color:var(--p3); }
.player-info { display:flex; align-items:center; gap:12px; }
.player-avatar { width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:1.3rem; flex-shrink:0; }
.avatar-1 { background:rgba(232,255,60,.13); color:var(--p1); }
.avatar-2 { background:rgba(60,170,255,.13); color:var(--p2); }
.avatar-3 { background:rgba(255,143,60,.13); color:var(--p3); }
.player-name { font-size:1rem; font-weight:700; }
.player-meta { font-size:.72rem; color:var(--muted2); margin-top:3px; display:flex; gap:8px; align-items:center; }
.player-pos { font-family:'JetBrains Mono',monospace; font-size:.67rem; padding:1px 6px; border:1px solid; }
.pos-1 { border-color:var(--p1); color:var(--p1); }
.pos-2 { border-color:var(--p2); color:var(--p2); }
.pos-3 { border-color:var(--p3); color:var(--p3); }

/* ── CONTROLS ROW: Category tabs + View toggle ── */
.controls-row {
  display:flex; align-items:stretch; justify-content:space-between;
  border-bottom:1px solid var(--border); margin-bottom:0; gap:0;
}
.category-tabs { display:flex; gap:0; }
.tab-btn {
  background:none; border:none; color:var(--muted);
  font-family:'JetBrains Mono',monospace; font-size:.7rem; letter-spacing:1.5px; text-transform:uppercase;
  padding:12px 22px; cursor:pointer; border-bottom:2px solid transparent;
  transition:color .2s, border-color .2s; position:relative; top:1px;
}
.tab-btn:hover { color:var(--text); }
.tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); }

/* View Mode Toggle (표/레이더) */
.view-toggle { display:flex; align-items:center; gap:0; padding-bottom:1px; }
.view-btn {
  background:none; border:1px solid var(--border); color:var(--muted);
  font-family:'JetBrains Mono',monospace; font-size:.65rem; letter-spacing:1px;
  padding:7px 16px; cursor:pointer; transition:all .2s; display:flex; align-items:center; gap:6px;
}
.view-btn:first-child { border-right:none; }
.view-btn.active { background:var(--surface2); color:var(--accent); border-color:var(--accent); }
.view-btn svg { width:14px; height:14px; }

/* ── STAT FILTER PANEL ── */
.stat-filter-panel {
  background:var(--surface); border:1px solid var(--border); border-top:none;
  padding:16px 20px; display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap;
}
.stat-filter-title {
  font-family:'JetBrains Mono',monospace; font-size:.63rem; letter-spacing:1.5px;
  color:var(--muted); text-transform:uppercase; padding-top:2px; white-space:nowrap; flex-shrink:0;
}
.stat-chips { display:flex; flex-wrap:wrap; gap:8px; flex:1; }
.chip {
  font-family:'JetBrains Mono',monospace; font-size:.67rem; letter-spacing:.8px;
  padding:4px 12px; border:1px solid var(--border); color:var(--muted2);
  cursor:pointer; transition:all .15s; user-select:none; border-radius:2px;
}
.chip:hover { border-color:var(--muted); color:var(--text); }
.chip.selected { border-color:var(--accent); color:var(--accent); background:rgba(232,255,60,.07); }
.chip-all { border-color:var(--muted); color:var(--muted2); }
.chip-all.selected { border-color:var(--muted2); color:var(--text); background:var(--surface2); }

/* ── TABLE VIEW ── */
.comparison-table { width:100%; border-collapse:collapse; }
.comparison-table thead tr { background:var(--surface); }
.comparison-table th { padding:18px 16px; text-align:left; font-weight:400; border-bottom:1px solid var(--border); }
.th-stat { font-family:'JetBrains Mono',monospace; font-size:.62rem; letter-spacing:2px; color:var(--muted); text-transform:uppercase; width:220px; }
.th-player { text-align:center; min-width:150px; }
.th-player-name { font-size:.92rem; font-weight:700; display:block; }
.th-player-team { font-size:.7rem; color:var(--muted2); font-weight:300; display:block; margin-top:2px; }
.th-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle; }
.dot-1 { background:var(--p1); } .dot-2 { background:var(--p2); } .dot-3 { background:var(--p3); }
.comparison-table tbody tr { border-bottom:1px solid var(--border); transition:background .15s; animation:fadeUp .35s both; }
.comparison-table tbody tr:hover { background:var(--surface); }
td.stat-label { padding:13px 16px; font-size:.8rem; color:var(--muted2); font-weight:300; }
td.stat-val { text-align:center; padding:13px 16px; }
.val-wrap { display:flex; flex-direction:column; align-items:center; gap:5px; }
.val-num { font-family:'JetBrains Mono',monospace; font-size:1.2rem; font-weight:600; }
.val-num.best { font-size:1.35rem; }
.val-bar-bg { width:72px; height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
.val-bar { height:100%; border-radius:2px; transition:width .7s cubic-bezier(.16,1,.3,1); }
.bar-1{background:var(--p1);} .bar-2{background:var(--p2);} .bar-3{background:var(--p3);}
.best-badge { font-family:'JetBrains Mono',monospace; font-size:.56rem; letter-spacing:1px; padding:1px 5px; border-radius:2px; }
.best-badge-1{background:rgba(232,255,60,.13);color:var(--p1);}
.best-badge-2{background:rgba(60,170,255,.13);color:var(--p2);}
.best-badge-3{background:rgba(255,143,60,.13);color:var(--p3);}

/* ── RADAR VIEW ── */
.radar-container {
  background:var(--surface); border:1px solid var(--border); border-top:none;
  padding:40px 20px; display:flex; flex-direction:column; align-items:center; gap:24px;
}
.radar-wrap { position:relative; }
#radarCanvas { display:block; }
.radar-legend {
  display:flex; gap:28px; justify-content:center;
}
.radar-legend-item { display:flex; align-items:center; gap:8px; font-size:.78rem; color:var(--muted2); }
.radar-legend-dot { width:10px; height:10px; border-radius:50%; }
.radar-note {
  font-family:'JetBrains Mono',monospace; font-size:.65rem; color:var(--muted);
  letter-spacing:1px; text-align:center;
}

/* Empty state */
.empty-state {
  padding:60px 20px; text-align:center;
  color:var(--muted); font-size:.85rem; letter-spacing:.5px;
  border:1px dashed var(--border); border-top:none;
}

/* Legend footer */
.legend { margin-top:28px; display:flex; align-items:center; gap:24px; padding-top:18px; border-top:1px solid var(--border); }
.legend-item { display:flex; align-items:center; gap:8px; font-size:.75rem; color:var(--muted2); font-weight:300; }
.legend-dot { width:10px; height:10px; border-radius:50%; }

@keyframes fadeUp {
  from { opacity:0; transform:translateY(6px); }
  to   { opacity:1; transform:translateY(0); }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-k">K</span>
    <span class="logo-rest">LEAGUE STATS</span>
  </div>
  <span class="season-badge">2024 SEASON</span>
</header>

<div class="main">

  <div class="page-title">
    <h1>선수 <span>비교</span> 매트릭스</h1>
    <p>최대 3명의 선수 선택 · 카테고리별 세부 지표 커스터마이징 · 표 / 레이더차트 전환 · K리그 1부 2024 기준</p>
  </div>

  <!-- FILTER BAR -->
  <div class="filter-bar">
    <span class="filter-label">필터</span>
    <select class="filter-select"><option>2024 시즌</option><option>2023 시즌</option><option>2022 시즌</option></select>
    <select class="filter-select"><option>전체 포지션</option><option>FW</option><option>MF</option><option>DF</option><option>GK</option></select>
    <select class="filter-select"><option>전체 팀</option><option>전북 현대</option><option>울산 HD</option><option>수원 FC</option></select>
    <div class="toggle-wrap">
      <span class="toggle-label">90분 기준</span>
      <div class="toggle" id="per90Toggle" onclick="this.classList.toggle('on')"></div>
    </div>
  </div>

  <!-- PLAYER SELECTOR -->
  <div class="player-selector">
    <div class="player-card active-1">
      <div class="player-slot-label">▸ PLAYER 01</div>
      <div class="player-info">
        <div class="player-avatar avatar-1">조</div>
        <div>
          <div class="player-name">조규성</div>
          <div class="player-meta"><span class="player-pos pos-1">FW</span> 전북 현대 · 28경기</div>
        </div>
      </div>
    </div>
    <div class="player-card active-2">
      <div class="player-slot-label">▸ PLAYER 02</div>
      <div class="player-info">
        <div class="player-avatar avatar-2">주</div>
        <div>
          <div class="player-name">주민규</div>
          <div class="player-meta"><span class="player-pos pos-2">FW</span> 울산 HD · 31경기</div>
        </div>
      </div>
    </div>
    <div class="player-card active-3">
      <div class="player-slot-label">▸ PLAYER 03</div>
      <div class="player-info">
        <div class="player-avatar avatar-3">이</div>
        <div>
          <div class="player-name">이승우</div>
          <div class="player-meta"><span class="player-pos pos-3">MF</span> 수원 FC · 30경기</div>
        </div>
      </div>
    </div>
  </div>

  <!-- CONTROLS ROW -->
  <div class="controls-row">
    <div class="category-tabs">
      <button class="tab-btn active" onclick="changeCategory(this,'attack')">공격</button>
      <button class="tab-btn" onclick="changeCategory(this,'pass')">패스</button>
      <button class="tab-btn" onclick="changeCategory(this,'defense')">수비</button>
    </div>
    <div class="view-toggle">
      <button class="view-btn active" id="viewTable" onclick="setView('table')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="1" y="1" width="14" height="3" rx=".5"/><rect x="1" y="6" width="14" height="3" rx=".5"/><rect x="1" y="11" width="14" height="3" rx=".5"/>
        </svg>
        표 형식
      </button>
      <button class="view-btn" id="viewRadar" onclick="setView('radar')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <polygon points="8,1 15,6 12.5,14 3.5,14 1,6"/>
          <polygon points="8,4 12,7 10.3,12 5.7,12 4,7"/>
        </svg>
        레이더 차트
      </button>
    </div>
  </div>

  <!-- STAT FILTER PANEL -->
  <div class="stat-filter-panel" id="statFilterPanel">
    <span class="stat-filter-title">지표 선택</span>
    <div class="stat-chips" id="statChips"></div>
  </div>

  <!-- OUTPUT AREA -->
  <div id="outputArea"></div>

  <!-- LEGEND -->
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--p1)"></div> 조규성 · 전북 현대</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--p2)"></div> 주민규 · 울산 HD</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--p3)"></div> 이승우 · 수원 FC</div>
    <div style="margin-left:auto; font-size:.7rem; color:var(--muted); font-family:'JetBrains Mono',monospace;">★ = 세 선수 중 최고값</div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════
const DATA = {
  attack: {
    label: '공격',
    rows: [
      { key:'goal',    stat:'골',           unit:'',  vals:[15,18,9],  radarMax:25 },
      { key:'assist',  stat:'어시스트',      unit:'',  vals:[4,6,11],  radarMax:15 },
      { key:'shot',    stat:'슈팅',          unit:'',  vals:[78,91,54], radarMax:110 },
      { key:'shotOT',  stat:'유효슈팅',      unit:'',  vals:[38,45,29], radarMax:55 },
      { key:'drib',    stat:'드리블 시도',    unit:'',  vals:[42,28,97], radarMax:110 },
      { key:'dribS',   stat:'드리블 성공',    unit:'',  vals:[24,14,61], radarMax:70 },
      { key:'dribR',   stat:'드리블 성공률',  unit:'%', vals:[57.1,50.0,62.9], radarMax:100 },
      { key:'offsid',  stat:'오프사이드',    unit:'',  vals:[18,22,7],  radarMax:30 },
    ]
  },
  pass: {
    label: '패스',
    rows: [
      { key:'pass',    stat:'패스 시도',     unit:'',  vals:[412,380,821], radarMax:900 },
      { key:'passS',   stat:'패스 성공',     unit:'',  vals:[337,298,694], radarMax:780 },
      { key:'passR',   stat:'패스 성공률',   unit:'%', vals:[81.8,78.4,84.5], radarMax:100 },
      { key:'keyP',    stat:'키패스',        unit:'',  vals:[22,19,58],  radarMax:70 },
      { key:'fwdP',    stat:'전방 패스',     unit:'',  vals:[198,176,312], radarMax:360 },
      { key:'cross',   stat:'크로스 시도',   unit:'',  vals:[31,22,88],  radarMax:100 },
      { key:'crossS',  stat:'크로스 성공',   unit:'',  vals:[10,8,31],   radarMax:40 },
    ]
  },
  defense: {
    label: '수비',
    rows: [
      { key:'tkl',     stat:'태클 시도',     unit:'',  vals:[28,19,61],  radarMax:70 },
      { key:'tklS',    stat:'태클 성공',     unit:'',  vals:[19,12,44],  radarMax:55 },
      { key:'tklR',    stat:'태클 성공률',   unit:'%', vals:[67.9,63.2,72.1], radarMax:100 },
      { key:'int',     stat:'인터셉트',      unit:'',  vals:[12,9,38],   radarMax:45 },
      { key:'clr',     stat:'클리어런스',    unit:'',  vals:[24,18,41],  radarMax:50 },
      { key:'aerial',  stat:'공중볼 경합',   unit:'',  vals:[88,72,34],  radarMax:100 },
      { key:'aerialW', stat:'공중볼 성공',   unit:'',  vals:[51,40,17],  radarMax:60 },
    ]
  }
};

const COLORS = ['#e8ff3c','#3caaff','#ff8f3c'];
const COLORS_ALPHA = ['rgba(232,255,60,', 'rgba(60,170,255,', 'rgba(255,143,60,'];
const BAR_CLS = ['bar-1','bar-2','bar-3'];
const BADGE_CLS = ['best-badge-1','best-badge-2','best-badge-3'];

let currentCategory = 'attack';
let currentView = 'table';
// selectedStats: set of keys currently visible
let selectedStats = new Set(DATA.attack.rows.map(r => r.key));

// ═══════════════════════════════════════════════
// CATEGORY CHANGE
// ═══════════════════════════════════════════════
function changeCategory(btn, cat) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCategory = cat;
  // reset to all selected for new category
  selectedStats = new Set(DATA[cat].rows.map(r => r.key));
  renderChips();
  renderOutput();
}

// ═══════════════════════════════════════════════
// VIEW TOGGLE
// ═══════════════════════════════════════════════
function setView(v) {
  currentView = v;
  document.getElementById('viewTable').classList.toggle('active', v === 'table');
  document.getElementById('viewRadar').classList.toggle('active', v === 'radar');
  renderOutput();
}

// ═══════════════════════════════════════════════
// CHIPS
// ═══════════════════════════════════════════════
function renderChips() {
  const rows = DATA[currentCategory].rows;
  const container = document.getElementById('statChips');

  // "전체" chip
  const allSelected = selectedStats.size === rows.length;
  let html = `<span class="chip chip-all ${allSelected?'selected':''}" onclick="toggleAll()">전체</span>`;

  rows.forEach(r => {
    const sel = selectedStats.has(r.key);
    html += `<span class="chip ${sel?'selected':''}" onclick="toggleChip('${r.key}')">${r.stat}</span>`;
  });
  container.innerHTML = html;
}

function toggleChip(key) {
  if (selectedStats.has(key)) {
    if (selectedStats.size === 1) return; // 최소 1개 유지
    selectedStats.delete(key);
  } else {
    selectedStats.add(key);
  }
  renderChips();
  renderOutput();
}

function toggleAll() {
  const rows = DATA[currentCategory].rows;
  if (selectedStats.size === rows.length) {
    // deselect all → keep first only
    selectedStats = new Set([rows[0].key]);
  } else {
    selectedStats = new Set(rows.map(r => r.key));
  }
  renderChips();
  renderOutput();
}

// ═══════════════════════════════════════════════
// OUTPUT ROUTER
// ═══════════════════════════════════════════════
function renderOutput() {
  if (currentView === 'table') renderTable();
  else renderRadar();
}

// ═══════════════════════════════════════════════
// TABLE VIEW
// ═══════════════════════════════════════════════
function renderTable() {
  const rows = DATA[currentCategory].rows.filter(r => selectedStats.has(r.key));
  if (!rows.length) { document.getElementById('outputArea').innerHTML = '<div class="empty-state">표시할 지표가 없습니다.</div>'; return; }

  let html = `
  <table class="comparison-table">
    <thead><tr>
      <th class="th-stat">스탯 항목</th>
      <th class="th-player"><span class="th-dot dot-1"></span><span class="th-player-name">조규성</span><span class="th-player-team">전북 현대</span></th>
      <th class="th-player"><span class="th-dot dot-2"></span><span class="th-player-name">주민규</span><span class="th-player-team">울산 HD</span></th>
      <th class="th-player"><span class="th-dot dot-3"></span><span class="th-player-name">이승우</span><span class="th-player-team">수원 FC</span></th>
    </tr></thead>
    <tbody>`;

  rows.forEach((row, ri) => {
    const max = Math.max(...row.vals);
    const bestIdx = row.vals.indexOf(max);
    html += `<tr style="animation-delay:${.04+ri*.04}s">`;
    html += `<td class="stat-label">${row.stat}</td>`;
    row.vals.forEach((v, i) => {
      const pct = Math.round((v / max) * 100);
      const isBest = i === bestIdx;
      html += `<td class="stat-val"><div class="val-wrap">
        <span class="val-num${isBest?' best':''}" style="color:${isBest?COLORS[i]:'var(--text)'}">
          ${v}${row.unit}
        </span>
        <div class="val-bar-bg"><div class="val-bar ${BAR_CLS[i]}" style="width:${pct}%"></div></div>
        ${isBest?`<span class="best-badge ${BADGE_CLS[i]}">★ 최고</span>`:''}
      </div></td>`;
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  document.getElementById('outputArea').innerHTML = html;
}

// ═══════════════════════════════════════════════
// RADAR VIEW
// ═══════════════════════════════════════════════
function renderRadar() {
  const rows = DATA[currentCategory].rows.filter(r => selectedStats.has(r.key));
  if (rows.length < 3) {
    document.getElementById('outputArea').innerHTML =
      '<div class="empty-state">레이더 차트는 지표를 3개 이상 선택해야 합니다.</div>';
    return;
  }

  document.getElementById('outputArea').innerHTML = `
    <div class="radar-container">
      <canvas id="radarCanvas" width="520" height="480"></canvas>
      <div class="radar-legend">
        <div class="radar-legend-item"><div class="radar-legend-dot" style="background:#e8ff3c"></div>조규성</div>
        <div class="radar-legend-item"><div class="radar-legend-dot" style="background:#3caaff"></div>주민규</div>
        <div class="radar-legend-item"><div class="radar-legend-dot" style="background:#ff8f3c"></div>이승우</div>
      </div>
      <div class="radar-note">각 축: 세 선수 중 최고값 기준 비율 (%) · 선택된 지표: ${rows.length}개</div>
    </div>`;

  drawRadar(rows);
}

function drawRadar(rows) {
  const canvas = document.getElementById('radarCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2 - 10;
  const R = Math.min(W, H) * 0.36;
  const n = rows.length;
  const angles = rows.map((_, i) => (Math.PI * 2 * i / n) - Math.PI / 2);

  ctx.clearRect(0, 0, W, H);

  // Normalize: ratio to max of radarMax for that row
  const normalize = (val, row) => Math.min(val / row.radarMax, 1);

  // BG grid
  const levels = 5;
  for (let lv = 1; lv <= levels; lv++) {
    const r = R * (lv / levels);
    ctx.beginPath();
    angles.forEach((a, i) => {
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.strokeStyle = lv === levels ? '#2a3340' : '#1a2030';
    ctx.lineWidth = lv === levels ? 1.5 : 1;
    ctx.stroke();
    // level label
    if (lv % 2 === 0) {
      ctx.font = '10px JetBrains Mono, monospace';
      ctx.fillStyle = '#3a4555';
      ctx.textAlign = 'center';
      ctx.fillText((lv/levels*100).toFixed(0)+'%', cx+4, cy - r + 12);
    }
  }

  // Spokes + labels
  angles.forEach((a, i) => {
    const x2 = cx + R * Math.cos(a), y2 = cy + R * Math.sin(a);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x2, y2);
    ctx.strokeStyle = '#1e2530'; ctx.lineWidth = 1; ctx.stroke();

    // Labels
    const lx = cx + (R + 32) * Math.cos(a);
    const ly = cy + (R + 32) * Math.sin(a);
    ctx.font = '11px Noto Sans KR, sans-serif';
    ctx.fillStyle = '#8a97a8';
    ctx.textAlign = Math.abs(Math.cos(a)) < .1 ? 'center' : (Math.cos(a) > 0 ? 'left' : 'right');
    ctx.textBaseline = ly < cy - 4 ? 'bottom' : (ly > cy + 4 ? 'top' : 'middle');
    ctx.fillText(rows[i].stat, lx, ly);
  });

  // Player polygons
  const players = [0, 1, 2];
  players.slice().reverse().forEach(pi => {
    const pts = rows.map((row, i) => {
      const norm = normalize(row.vals[pi], row);
      return { x: cx + R * norm * Math.cos(angles[i]), y: cy + R * norm * Math.sin(angles[i]) };
    });
    ctx.beginPath();
    pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.closePath();
    ctx.fillStyle = COLORS_ALPHA[pi] + '0.13)';
    ctx.fill();
    ctx.strokeStyle = COLORS[pi];
    ctx.lineWidth = 2;
    ctx.stroke();

    // Dots
    pts.forEach(p => {
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
      ctx.fillStyle = COLORS[pi]; ctx.fill();
      ctx.strokeStyle = '#0a0d12'; ctx.lineWidth = 1.5; ctx.stroke();
    });
  });
}
